services:

  # ============================================================
  # Backend - FastAPI
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: enterprise-ai-backend

    ports:
      - "8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"

      # --------------------------------------------------------
      # Application Security
      # --------------------------------------------------------
      SECRET_KEY: "${SECRET_KEY}"

      # --------------------------------------------------------
      # PostgreSQL - Neon
      # --------------------------------------------------------
      DATABASE_URL: "${DATABASE_URL}"

      # --------------------------------------------------------
      # Redis
      # --------------------------------------------------------
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"

      # --------------------------------------------------------
      # MinIO / S3-compatible Object Storage
      # --------------------------------------------------------
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET: "${MINIO_BUCKET}"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

      minio:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # Background Worker - Document Processing
  # ============================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: enterprise-ai-worker

    command:
      - python
      - -m
      - app.workers.worker_main

    environment:
      PYTHONUNBUFFERED: "1"

      # --------------------------------------------------------
      # Application Security
      # --------------------------------------------------------
      SECRET_KEY: "${SECRET_KEY}"

      # --------------------------------------------------------
      # PostgreSQL - Neon
      # --------------------------------------------------------
      DATABASE_URL: "${DATABASE_URL}"

      # --------------------------------------------------------
      # Redis
      # --------------------------------------------------------
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"

      # --------------------------------------------------------
      # MinIO / S3-compatible Object Storage
      # --------------------------------------------------------
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET: "${MINIO_BUCKET}"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

      minio:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # Frontend - Next.js
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: enterprise-ai-frontend

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: "production"

      # Browser -> Backend
      NEXT_PUBLIC_API_URL: "http://localhost:8000"

      # Next.js container -> Backend container
      INTERNAL_API_URL: "http://backend:8000"

    depends_on:
      backend:
        condition: service_started

    restart: unless-stopped


  # ============================================================
  # PostgreSQL - Local Container
  # ============================================================
  postgres:
    image: postgres:16-alpine

    container_name: enterprise-ai-postgres

    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "enterprise_ai"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d enterprise_ai"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine

    container_name: enterprise-ai-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  # ============================================================
  # MinIO - Object Storage
  # ============================================================
  minio:
    image: minio/minio:latest

    container_name: enterprise-ai-minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


# ============================================================
# Persistent Volumes
# ============================================================
volumes:

  postgres_data:

  redis_data:

  minio_data:


